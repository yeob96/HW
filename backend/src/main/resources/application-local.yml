# 로컬 개발용 — Docker PostgreSQL이 아직 없어도 뜨도록 H2 인메모리를 쓴다.
# PostgreSQL 모드로 맞춰 두었기 때문에 스키마를 postgres 프로파일로 옮길 때 차이가 적다.
spring:
  datasource:
    url: jdbc:h2:mem:gongmae;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
