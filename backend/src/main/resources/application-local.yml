# 로컬 개발용 — Docker PostgreSQL이 아직 없어도 뜨도록 H2 인메모리를 쓴다.
# PostgreSQL 모드로 맞춰 두었기 때문에 스키마를 postgres 프로파일로 옮길 때 차이가 적다.
spring:
  datasource:
    # 파일 기반이라 재시작해도 수집한 물건과 분석 결과가 남는다.
    # 인메모리면 재시작마다 "모든 물건이 신규"가 되어 알림 동작을 확인할 수 없다.
    url: jdbc:h2:file:./data/h2/gongmae;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
